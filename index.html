<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="description" content="Lunara Society — Constitutional governance authority for the autonomous economy.">
<title>Lunara Society</title>
<link rel="icon" type="image/png" href="lunara_logo_512.png">
<link rel="apple-touch-icon" href="lunara_logo_512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@200;300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}

/* Main canvas for particle dissolution layer */
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;z-index:2}

/* Emblem: real image, CSS-animated, clickable */
#emblem-wrap{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:3;
  cursor:default;
}
#emblem-img{
  display:block;
  opacity:0;
  filter:brightness(0.95) saturate(1.1);
  transition:opacity 3.2s cubic-bezier(0.22,1,0.36,1), filter 0.5s ease;
  animation: none;
}
#emblem-img.visible{opacity:1}
#emblem-img.breathe{
  animation: breathe 6s ease-in-out infinite;
}
#emblem-img.dissolving{
  opacity:0 !important;
  transition:opacity 0.6s ease !important;
}

@keyframes breathe{
  0%,100%{ filter:brightness(0.90) saturate(1.05) drop-shadow(0 0 22px rgba(196,144,40,0.25)); }
  50%{     filter:brightness(1.06) saturate(1.20) drop-shadow(0 0 55px rgba(230,175,60,0.60)); }
}

/* When emblem is clickable (after reveal), show pointer */
#emblem-wrap.active{cursor:pointer}
#emblem-wrap.active:hover #emblem-img{
  filter:brightness(1.12) saturate(1.30) drop-shadow(0 0 65px rgba(235,185,70,0.70)) !important;
  animation-play-state:paused;
}

/* Outer ring glow */
#glow{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  pointer-events:none;
  opacity:0;
  background:transparent;
  transition:opacity 3.5s ease;
  z-index:1;
}
#glow.visible{ opacity:1; }
#glow.breathe{ animation: glowPulse 6s ease-in-out infinite; }
#glow.dissolving{ opacity:0!important; transition:opacity 0.5s ease!important; }

@keyframes glowPulse{
  0%,100%{ box-shadow:0 0 40px 8px rgba(196,144,30,0.10), 0 0 80px 20px rgba(196,144,30,0.05); }
  50%{     box-shadow:0 0 70px 20px rgba(220,170,50,0.28), 0 0 140px 50px rgba(210,150,30,0.12); }
}

/* Welcome text — ABOVE emblem */
#welcome{
  position:fixed;left:50%;transform:translateX(-50%);
  white-space:nowrap;opacity:0;pointer-events:none;
  font-family:'Cormorant Garamond',serif;
  font-size:14px;font-weight:300;
  letter-spacing:0.52em;
  color:rgba(210,185,135,0.86);
  text-transform:uppercase;text-align:center;
  transition:opacity 2.8s ease;
  z-index:10;
}
#welcome.show{opacity:0.88}
#welcome.out{opacity:0!important;transition:opacity 0.8s ease!important}

/* The threshold — a thin gold line below the emblem */
#threshold{
  position:fixed;left:50%;transform:translateX(-50%);
  opacity:0;cursor:pointer;
  z-index:10;
  width:60px;height:1px;
  background:linear-gradient(90deg, transparent, rgba(210,175,100,0.65), transparent);
  transition:opacity 2s ease, width 0.5s ease, background 0.5s ease;
  pointer-events:auto;
}
#threshold.show{opacity:1}
#threshold::after{
  content:'';
  position:absolute;top:-2px;left:50%;transform:translateX(-50%);
  width:6px;height:6px;border-radius:50%;
  background:rgba(225,185,105,0.75);
  box-shadow:0 0 10px rgba(225,185,105,0.5);
  transition:all 0.5s ease;
}
#threshold.breathe::after{
  animation: dotPulse 6s ease-in-out infinite;
}
@keyframes dotPulse{
  0%,100%{ opacity:0.45; box-shadow:0 0 8px rgba(210,175,95,0.35); }
  50%{     opacity:0.95; box-shadow:0 0 18px rgba(235,195,110,0.7); }
}
#threshold:hover{
  width:110px;
  background:linear-gradient(90deg, transparent, rgba(230,195,120,0.85), transparent);
}
#threshold:hover::after{
  width:7px;height:7px;
  background:rgba(235,200,120,0.95);
  box-shadow:0 0 16px rgba(235,200,120,0.7);
}
#threshold.out{opacity:0!important;pointer-events:none;transition:opacity 0.7s ease!important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="glow"></div>

<div id="welcome">You were expected</div>

<div id="emblem-wrap">
  <img id="emblem-img" src="lunara_emblem_transparent.png" alt="Lunara Society">
</div>

<div id="threshold"></div>

<script>
(function(){

const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const embImg  = document.getElementById('emblem-img');
const glowEl  = document.getElementById('glow');
const embWrap = document.getElementById('emblem-wrap');
const welEl   = document.getElementById('welcome');
const thrEl   = document.getElementById('threshold');

let W, H, cx, cy, dpr;
let dissolveParticles = [];
let dissolving = false;
let dissolveStart = 0;
let phase = 'black';
let phaseStart = 0;
let lastT = 0;

function emblemPx(){
  return Math.min(W, H) * 0.50;
}

function setLayout(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
  cx = W/2; cy = H/2;

  const ep = emblemPx();
  embImg.style.width  = ep + 'px';
  embImg.style.height = ep + 'px';
  glowEl.style.width  = (ep * 1.15) + 'px';
  glowEl.style.height = (ep * 1.15) + 'px';

  // Welcome text ABOVE emblem
  welEl.style.top = (cy - ep/2 - 36) + 'px';
  // Threshold line BELOW emblem
  thrEl.style.top = (cy + ep/2 + 32) + 'px';
}

function buildDissolveParticles(callback){
  const offC = document.createElement('canvas');
  const offCtx = offC.getContext('2d');
  const ep = emblemPx();
  const SZ = 192;
  offC.width = SZ; offC.height = SZ;
  offCtx.drawImage(embImg, 0, 0, SZ, SZ);
  const dat = offCtx.getImageData(0,0,SZ,SZ).data;

  const scale = ep / SZ;
  const ox = cx - ep/2;
  const oy = cy - ep/2;
  const pts = [];
  const step = 2;

  for(let y=0;y<SZ;y+=step){
    for(let x=0;x<SZ;x+=step){
      const i=(y*SZ+x)*4;
      const r=dat[i],g=dat[i+1],b=dat[i+2];
      if((r+g+b)/3 < 20) continue;
      const px = ox + x*scale + (Math.random()-0.5)*2;
      const py = oy + y*scale + (Math.random()-0.5)*2;
      const ang = Math.atan2(py-cy, px-cx);
      const spread = (Math.random()-0.5)*0.5;
      const speed = 1.2 + Math.random()*3.2;
      pts.push({
        x: px, y: py,
        vx: Math.cos(ang+spread)*speed,
        vy: Math.sin(ang+spread)*speed,
        r: r, g: g, b: b,
        sz: 0.6 + Math.random()*0.8,
        life: 0.8 + Math.random()*0.2
      });
    }
  }
  dissolveParticles = pts;
  callback();
}

function loop(now){
  lastT = now;
  ctx.clearRect(0, 0, W, H);
  const el = now - phaseStart;

  if(phase === 'black'){
    if(el > 900){ phase='reveal'; phaseStart=now; }
  }
  else if(phase === 'reveal'){
    if(el < 50){
      embImg.classList.add('visible');
      glowEl.classList.add('visible');
    }
    if(el > 3400){
      phase='living'; phaseStart=now;
      embImg.classList.add('breathe');
      glowEl.classList.add('breathe');
    }
  }
  else if(phase === 'living'){
    if(el > 300  && !welEl.classList.contains('show')) welEl.classList.add('show');
    if(el > 1800 && !thrEl.classList.contains('show')){ thrEl.classList.add('show'); thrEl.classList.add('breathe'); }
    if(el > 1800 && !embWrap.classList.contains('active')) embWrap.classList.add('active');
  }
  else if(phase === 'dissolve'){
    const elapsed = now - dissolveStart;
    dissolveParticles.forEach(p=>{
      if(p.life <= 0) return;
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.983; p.vy *= 0.983;
      p.life -= 0.007;
      ctx.fillStyle='rgba('+p.r+','+p.g+','+p.b+','+(p.life*0.78)+')';
      ctx.fillRect(p.x, p.y, p.sz, p.sz);
    });
    if(elapsed > 2800) { window.location.href='home.html?audio=1'; return; }
  }

  requestAnimationFrame(loop);
}

function activate(){
  if(dissolving) return;
  dissolving = true;
  embWrap.classList.remove('active');
  embImg.classList.add('dissolving');
  glowEl.classList.add('dissolving');
  welEl.classList.add('out');
  thrEl.classList.add('out');
  buildDissolveParticles(function(){
    phase = 'dissolve';
    dissolveStart = performance.now();
  });
}

// Both emblem and threshold are clickable
embWrap.addEventListener('click', activate);
embWrap.addEventListener('touchstart', function(e){ e.preventDefault(); activate(); }, {passive:false});
thrEl.addEventListener('click', activate);
thrEl.addEventListener('touchstart', function(e){ e.preventDefault(); activate(); }, {passive:false});

// Hover sync: hovering either element boosts the glow
function boostGlow(){
  glowEl.style.boxShadow='0 0 90px 30px rgba(220,170,55,0.32),0 0 160px 60px rgba(210,150,30,0.15)';
}
function calmGlow(){
  glowEl.style.boxShadow='';
}
embWrap.addEventListener('mouseenter', boostGlow);
embWrap.addEventListener('mouseleave', calmGlow);
thrEl.addEventListener('mouseenter', boostGlow);
thrEl.addEventListener('mouseleave', calmGlow);

window.addEventListener('resize', setLayout);

setLayout();
phaseStart = performance.now();
lastT = phaseStart;
requestAnimationFrame(loop);

const pre = document.createElement('link');
pre.rel='prefetch'; pre.href='home.html';
document.head.appendChild(pre);

})();
</script>
</body>
</html>
