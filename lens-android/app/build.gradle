plugins { id 'com.android.application' }

def host = 'lunarasociety.com'
def startUrl = '/lens/app.html'

android {
    namespace 'com.lunarasociety.lens'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lunarasociety.lens'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '3.0.0'
        manifestPlaceholders = [
            hostName: host,
            defaultUrl: "https://${host}${startUrl}",
            launcherName: 'Rosario',
            themeColor: '#000000',
            backgroundColor: '#000000'
        ]
        resValue 'string', 'asset_statements', """[{ \\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": { \\"namespace\\": \\"web\\", \\"site\\": \\"https://${host}\\" } }]"""
    }
    /* Two copies of the same app. "play" is uploaded to Google Play: it
       opens the web app with ?src=play, which sells plans and credits only
       through Google Play Billing, as Play's payments policy requires.
       "web" is the copy downloaded from lunarasociety.com, which uses
       Stripe Checkout. */
    flavorDimensions 'store'
    productFlavors {
        play {
            dimension 'store'
            manifestPlaceholders = [defaultUrl: "https://${host}${startUrl}?src=play"]
        }
        web {
            dimension 'store'
            manifestPlaceholders = [defaultUrl: "https://${host}${startUrl}"]
        }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('LENS_KEYSTORE') ?: '../lunara-lens-release.jks')
            storePassword System.getenv('LENS_KEYSTORE_PASSWORD')
            keyAlias 'lunaralens'
            keyPassword System.getenv('LENS_KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'com.google.androidbrowserhelper:billing:1.2.0'
}
