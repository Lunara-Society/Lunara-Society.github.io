<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000000}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:200;cursor:default}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
.text-layer{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:10}

/* Welcome text — ABOVE the emblem */
.welcome-text{position:absolute;top:calc(50% - 230px);left:50%;transform:translate(-50%,0);opacity:0;transition:opacity 2.5s ease;white-space:nowrap}
.welcome-text.show{opacity:0.92}
.welcome-text h1{font-size:15px;font-weight:200;letter-spacing:0.45em;color:rgba(224,224,176,0.92);text-transform:uppercase;text-align:center}

/* Enter indicator — BELOW the emblem, no text, just a breathing gold line */
.enter-cue{position:absolute;top:calc(50% + 230px);left:50%;transform:translate(-50%,0);opacity:0;transition:opacity 2s ease;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px}
.enter-cue.show{opacity:0.6}
.enter-cue:hover{opacity:0.95;transition:opacity 0.4s ease}

.enter-line{width:48px;height:1px;background:linear-gradient(90deg,transparent,rgba(196,164,107,0.9),transparent);animation:breathe 3.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:0.3;transform:scaleX(0.7)}50%{opacity:1;transform:scaleX(1)}}

.enter-dot{width:4px;height:4px;border-radius:50%;background:rgba(224,224,176,0.85);box-shadow:0 0 8px rgba(196,164,107,0.6);animation:pulse 3.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}

body.dissolving .enter-cue{opacity:0 !important;pointer-events:none;transition:opacity 0.8s ease}
body.dissolving .welcome-text{opacity:0 !important;transition:opacity 0.8s ease}
body.dissolving .enter-line,body.dissolving .enter-dot{animation:none}
</style>
  <link rel="stylesheet" href="lunara-refined.css">
  <link rel="canonical" href="https://lunarasociety.com/activation.html">

<body>

<canvas id="canvas"></canvas>

<div class="text-layer">
  <div class="welcome-text" id="welcome">
    <h1>Welcome to Lunara Society</h1>
  </div>
  <div class="enter-cue" id="enter">
    <div class="enter-line"></div>
    <div class="enter-dot"></div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const welcomeEl = document.getElementById('welcome');
  const enterEl = document.getElementById('enter');

  let W, H, cx, cy, dpr;
  let particles = [];
  let phase = 'black';
  let phaseStart = 0;
  let hoverIntensity = 0;
  let targetHoverIntensity = 0;
  let dissolveStart = 0;
  let dissolving = false;
  let animTime = 0;
  let lastTime = 0;

  const goldBase = { r: 196, g: 164, b: 107 };
  const goldBright = { r: 230, g: 200, b: 140 };
  const goldDim = { r: 160, g: 130, b: 80 };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    cx = W / 2;
    cy = H / 2;
  }

  class Particle {
    constructor(hx, hy) {
      this.hx = hx;
      this.hy = hy;
      this.x = cx + (Math.random() - 0.5) * W * 1.5;
      this.y = cy + (Math.random() - 0.5) * H * 1.5;
      this.vx = 0;
      this.vy = 0;
      this.size = 0.7 + Math.random() * 0.8;
      this.phase = Math.random() * Math.PI * 2;
      this.freq = 0.25 + Math.random() * 0.35;
      this.amp = 0.25 + Math.random() * 0.6;
      this.brightness = 0.45 + Math.random() * 0.55;
      this.colorShift = Math.random();
      this.life = 0;
      this.dvx = 0;
      this.dvy = 0;
    }

    update(t, intensity) {
      if (dissolving) {
        this.x += this.dvx;
        this.y += this.dvy;
        this.dvx *= 0.985;
        this.dvy *= 0.985;
        this.life -= 0.007;
        return;
      }

      const oscX = Math.sin(t * this.freq + this.phase) * this.amp * (1 + intensity * 2.5);
      const oscY = Math.cos(t * this.freq * 0.7 + this.phase) * this.amp * (1 + intensity * 2.5);

      const targetX = this.hx + oscX;
      const targetY = this.hy + oscY;

      const dx = targetX - this.x;
      const dy = targetY - this.y;
      this.vx += dx * 0.035;
      this.vy += dy * 0.035;
      this.vx *= 0.84;
      this.vy *= 0.84;
      this.x += this.vx;
      this.y += this.vy;
    }

    draw(ctx) {
      if (this.life <= 0) return;
      const alpha = this.brightness * this.life;
      let r, g, b;
      if (this.colorShift < 0.25) {
        r = goldDim.r; g = goldDim.g; b = goldDim.b;
      } else if (this.colorShift > 0.75) {
        r = goldBright.r; g = goldBright.g; b = goldBright.b;
      } else {
        r = goldBase.r; g = goldBase.g; b = goldBase.b;
      }
      ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (alpha * 0.8) + ')';
      ctx.fillRect(this.x, this.y, this.size, this.size);
    }
  }

  function generateEmblemPoints(callback) {
    const img = new Image();
    img.onload = function() {
      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');
      const imgSize = img.width;
      offCanvas.width = imgSize;
      offCanvas.height = imgSize;
      offCtx.drawImage(img, 0, 0);
      const imageData = offCtx.getImageData(0, 0, imgSize, imgSize);
      const data = imageData.data;

      const emblemSize = Math.min(W, H) * 0.38;
      const scale = emblemSize / imgSize;
      const offsetX = cx - emblemSize / 2;
      const offsetY = cy - emblemSize / 2;

      const points = [];
      const step = 3;

      for (let y = 0; y < imgSize; y += step) {
        for (let x = 0; x < imgSize; x += step) {
          const idx = (y * imgSize + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          const brightness = (r + g + b) / 3;
          if (brightness > 35 && (r > 45 || g > 45 || b > 45)) {
            points.push({
              x: offsetX + x * scale + (Math.random() - 0.5) * 1.5,
              y: offsetY + y * scale + (Math.random() - 0.5) * 1.5
            });
          }
        }
      }

      const maxParticles = 2600;
      let sampled = points;
      if (points.length > maxParticles) {
        sampled = [];
        const ratio = points.length / maxParticles;
        for (let i = 0; i < maxParticles; i++) {
          sampled.push(points[Math.floor(i * ratio)]);
        }
      }

      sampled.forEach(p => {
        particles.push(new Particle(p.x, p.y));
      });

      callback();
    };
    img.src = 'lunara_logo_512.png';
  }

  function drawGlow(intensity) {
    if (dissolving) return;
    const emblemSize = Math.min(W, H) * 0.38;
    const glowRadius = emblemSize * 0.75;
    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius);
    const glowAlpha = 0.012 + intensity * 0.008;
    gradient.addColorStop(0, 'rgba(196,164,107,' + glowAlpha + ')');
    gradient.addColorStop(0.5, 'rgba(196,164,107,' + (glowAlpha * 0.25) + ')');
    gradient.addColorStop(1, 'rgba(196,164,107,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(cx - glowRadius, cy - glowRadius, glowRadius * 2, glowRadius * 2);
  }

  function animate(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    animTime += dt;

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    const elapsed = now - phaseStart;

    if (phase === 'black') {
      if (elapsed > 800) {
        phase = 'materialize';
        phaseStart = now;
      }
    } else if (phase === 'materialize') {
      drawGlow(0);
      const progress = Math.min(elapsed / 3000, 1);
      const easeProgress = 1 - Math.pow(1 - progress, 3);
      particles.forEach(p => {
        p.update(animTime, 0);
        p.life = easeProgress;
        p.draw(ctx);
      });
      if (progress >= 1) {
        phase = 'living';
        phaseStart = now;
        particles.forEach(p => p.life = p.brightness);
      }
    } else if (phase === 'living') {
      drawGlow(hoverIntensity * 0.4);
      hoverIntensity += (targetHoverIntensity - hoverIntensity) * 0.04;
      particles.forEach(p => {
        p.update(animTime, hoverIntensity);
        p.draw(ctx);
      });
      if (elapsed > 1500 && !welcomeEl.classList.contains('show')) {
        welcomeEl.classList.add('show');
      }
      if (elapsed > 3200 && !enterEl.classList.contains('show')) {
        enterEl.classList.add('show');
      }
    } else if (phase === 'dissolving') {
      const elapsedD = now - dissolveStart;
      const progress = Math.min(elapsedD / 2500, 1);
      particles.forEach(p => {
        p.update(animTime, 0);
        p.draw(ctx);
      });
      if (progress >= 1) {
        window.location.href = 'home.html';
      }
    }

    requestAnimationFrame(animate);
  }

  enterEl.addEventListener('mouseenter', function() {
    if (!dissolving) targetHoverIntensity = 1.5;
  });
  enterEl.addEventListener('mouseleave', function() {
    if (!dissolving) targetHoverIntensity = 0;
  });

  document.addEventListener('mousemove', function(e) {
    if (dissolving) return;
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const emblemSize = Math.min(W, H) * 0.38;
    if (dist < emblemSize * 1.3) {
      const proximity = 1 - (dist / (emblemSize * 1.3));
      if (!enterEl.matches(':hover')) {
        targetHoverIntensity = proximity * 0.7;
      }
    } else if (!enterEl.matches(':hover')) {
      targetHoverIntensity = 0;
    }
  });

  function startDissolve() {
    if (dissolving) return;
    dissolving = true;
    document.body.classList.add('dissolving');
    phase = 'dissolving';
    dissolveStart = performance.now();
    particles.forEach(p => {
      const dx = p.x - cx;
      const dy = p.y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      p.dvx = (dx / dist) * (2 + Math.random() * 4);
      p.dvy = (dy / dist) * (2 + Math.random() * 4);
    });
  }

  enterEl.addEventListener('click', startDissolve);

  // Also allow clicking the emblem area itself
  canvas.addEventListener('click', function(e) {
    if (dissolving) return;
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const emblemSize = Math.min(W, H) * 0.38;
    if (dist < emblemSize * 0.7) {
      startDissolve();
    }
  });

  // Touch support — tap anywhere on the emblem to enter
  canvas.addEventListener('touchend', function(e) {
    if (dissolving) return;
    if (e.changedTouches.length > 0) {
      const touch = e.changedTouches[0];
      const dx = touch.clientX - cx;
      const dy = touch.clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const emblemSize = Math.min(W, H) * 0.38;
      if (dist < emblemSize * 0.8) {
        startDissolve();
      }
    }
  });

  resize();
  window.addEventListener('resize', function() {
    resize();
  });

  generateEmblemPoints(function() {
    phaseStart = performance.now();
    lastTime = phaseStart;
    requestAnimationFrame(animate);
  });

})();
</script>
<script src="lunara-immersive.js" defer></script>
</body>
</html>
