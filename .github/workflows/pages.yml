name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The obligation table in lunara-clock.js and the published corpus in
      # corpus/obligations.json must agree. They are one table emitted twice,
      # and this institution has already published a correction caused by
      # reading one source and not another. A generated file nobody
      # regenerates is a second hand-maintained table with extra steps, so
      # the deploy stops rather than serving two answers.
      - name: Verify the regulatory corpus
        run: node tools/verify-corpus.mjs

      # Every figure on a page must come from the pricing table. This caught
      # a $99 Shield next to a button charging $75, a "$2,599 initial" card
      # above a button charging $7,400, and thirty-three files advertising a
      # catalogue that had been superseded — none of which anything was
      # looking for, because nothing was.
      - name: Verify prices
        run: node tools/verify-prices.mjs

      # Rosario is the address published in llms.txt. If the corpus corrects a
      # date and her briefing still carries the old one, the institution has
      # two answers and the one a prospect hears is the stale one — the failure
      # behind all four published corrections, pointed at a person this time.
      - name: Verify Rosario's brain
        run: node tools/verify-rosario-brain.mjs

      # The site once gave three answers to "what does the registry
      # return": the page said lunara_id, openapi.yaml said public_id, and
      # the server said found. llms.txt points AI systems at that spec, so
      # the mismatch was aimed at machines — a system reading it looked for
      # a key that is never sent. One source now, every surface emitted
      # from it, and every response carrying an evidence mark.
      - name: Verify the registry protocol
        run: node tools/verify-registry-protocol.mjs

      # Everything this institution publishes for machines travels as JSON,
      # and a copy of it — a mirror, a cached crawl, a vendor's snapshot —
      # carries none of the transport security of the original fetch. Each
      # document is published with a detached Ed25519 assertion over its
      # hash, and a signature covering the previous version of a document is
      # worse than no signature: it invites a reader to check, tells them
      # the check failed, and leaves them unable to tell a stale build from
      # an attack. So the deploy stops while any document and its assertion
      # disagree. Re-signing is one command and the failure message carries it.
      - name: Verify published signatures
        run: node tools/verify-signatures.mjs

      # And the verifier itself is exercised against tampering, because a
      # verifier that always says yes passes every test that only feeds it
      # good input and looks identical in the log.
      - name: Exercise the signing layer against tampering
        run: node tools/test-assertions.mjs

      # `npx @lunara/mcp` was printed on the homepage, on the MCP page, in
      # llms.txt, in the corpus index and in Rosario's briefing for weeks
      # while the package did not exist. Every reader who followed our own
      # install instructions got a 404 — a form posting into nothing,
      # aimed at the audience this institution most wants to reach. While
      # the registry does not answer for a package, no surface here may
      # print its install command except where it says so in the same
      # breath. A registry that cannot be reached is not a failure: the
      # gate reports that it could not check rather than stopping a deploy.
      - name: Verify install commands resolve
        run: node tools/verify-install-commands.mjs

      # The member area is the only place on this site where a person hands
      # over a credential, and the four functions behind it used to answer
      # 404 to every call — the form posted into nothing for as long as it
      # was up. The suite signs real tokens against a generated keypair, so
      # a regression in the signature check fails here rather than letting
      # anyone sign in as anyone.
      - name: Verify member authentication
        run: node member-auth/test_auth.mjs

      # The WhatsApp Worker has no deploy gate of its own — it is pasted
      # into Cloudflare by hand — so this is the only thing standing between
      # a bad edit and a webhook Meta silently drops.
      - name: Exercise the WhatsApp Worker
        run: |
          cp whatsapp-webhook/worker.js whatsapp-webhook/worker.mjs
          node whatsapp-webhook/test_worker.mjs
          rm -f whatsapp-webhook/worker.mjs

      # The MCP server is the doorway AI systems come through, so it is
      # exercised against this commit's corpus rather than against the
      # deployed one — otherwise a corpus change and the server that reads
      # it are never tested together until after both are live.
      - name: Exercise the MCP server against this commit's corpus
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8899/corpus/obligations.json && break
            sleep 1
          done
          LUNARA_AUTHORITY=http://127.0.0.1:8899 node mcp/test/smoke.mjs

      # Deployment sits right on GitHub's ten-minute limit, so three of the
      # last six deploys were killed mid-flight. The action's own timeout
      # input does not help — the limit is enforced server side — so the
      # only lever is publishing less.
      #
      # These files are referenced by nothing: no page, script, stylesheet
      # or manifest anywhere in the repository. Dropping them from the
      # PUBLISHED artifact removes ~12MB from every deploy.
      #
      # This deletes nothing. The files remain in git and on the branch;
      # they are simply removed from the runner's checkout before it is
      # packaged, so they stop being served. Delete a line to publish a
      # file again.
      - name: Trim unreferenced media from the published artifact
        run: |
          before=$(du -sm . | cut -f1)
          rm -f rosario_talking.webm \
                lunara_avatar_hook.webm \
                maya-hologram-v2.png \
                maya-hologram-new.png \
                maya-hologram-clean.png \
                lunara_emblem_full.png \
                lunara_emblem_v2_768.png
          after=$(du -sm . | cut -f1)
          echo "published payload: ${before}MB -> ${after}MB"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # This site's deployment step reliably takes about ten minutes,
          # which is exactly the action's default timeout — so deploys were
          # failing or succeeding at random. Observed: 9m26s succeeded,
          # 10m05s timed out, two earlier runs timed out the same way.
          # Thirty minutes leaves real headroom; a healthy deploy still
          # finishes in ten and exits as soon as it is done.
          timeout: 1800000
          # Report progress less often so a slow deployment is not mistaken
          # for a stalled one.
          reporting_interval: 15000
