<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="description" content="Lunara Society — Constitutional governance authority for the autonomous economy.">
<title>Lunara Society</title>
<link rel="icon" type="image/png" href="lunara_logo_512.png">
<link rel="apple-touch-icon" href="lunara_logo_512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@200;300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{cursor:default}

/* Main canvas for particle dissolution layer */
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;z-index:2}

/* Emblem: real image, CSS-animated */
#emblem-wrap{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:3;
  pointer-events:none;
}
#emblem-img{
  display:block;
  opacity:0;
  mix-blend-mode:screen;
  filter:brightness(0.95) saturate(1.1);
  transition:opacity 3.2s cubic-bezier(0.22,1,0.36,1);
  animation: none;
}
#emblem-img.visible{opacity:1}
#emblem-img.breathe{
  animation: breathe 6s ease-in-out infinite;
}
#emblem-img.dissolving{
  opacity:0 !important;
  transition:opacity 0.6s ease !important;
}

@keyframes breathe{
  0%,100%{ filter:brightness(0.90) saturate(1.05) drop-shadow(0 0 22px rgba(196,144,40,0.25)); }
  50%{     filter:brightness(1.06) saturate(1.20) drop-shadow(0 0 55px rgba(230,175,60,0.60)); }
}

/* Outer ring glow — pure CSS radial, no canvas */
#glow{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  pointer-events:none;
  opacity:0;
  background:transparent;
  transition:opacity 3.5s ease;
  z-index:1;
  animation:none;
}
#glow.visible{ opacity:1; }
#glow.breathe{ animation: glowPulse 6s ease-in-out infinite; }
#glow.dissolving{ opacity:0!important; transition:opacity 0.5s ease!important; }

@keyframes glowPulse{
  0%,100%{ box-shadow:0 0 40px 8px rgba(196,144,30,0.10), 0 0 80px 20px rgba(196,144,30,0.05); }
  50%{     box-shadow:0 0 70px 20px rgba(220,170,50,0.28), 0 0 140px 50px rgba(210,150,30,0.12); }
}

/* Hover intensity ring — shows on hover approach */
#emblem-wrap:hover #emblem-img{
  filter:brightness(1.10) saturate(1.28) drop-shadow(0 0 60px rgba(230,180,65,0.65));
  transition:filter 0.5s ease;
}

/* Text */
#welcome{
  position:fixed;left:50%;transform:translateX(-50%);
  white-space:nowrap;opacity:0;pointer-events:none;
  font-family:'Cormorant Garamond',serif;
  font-size:13px;font-weight:300;
  letter-spacing:0.52em;
  color:rgba(210,185,135,0.86);
  text-transform:uppercase;text-align:center;
  transition:opacity 2.8s ease;
  z-index:10;
}
#welcome.show{opacity:0.88}
#welcome.out{opacity:0!important;transition:opacity 0.8s ease!important}

#enter{
  position:fixed;left:50%;transform:translateX(-50%);
  white-space:nowrap;opacity:0;
  font-family:'Inter',sans-serif;
  font-size:11px;font-weight:200;
  letter-spacing:0.52em;
  color:rgba(196,160,90,0.52);
  text-transform:uppercase;text-align:center;
  transition:opacity 2s ease;
  z-index:10;cursor:pointer;
  padding:14px 32px;
}
#enter.show{opacity:0.55}
#enter:hover{
  opacity:1;color:rgba(230,200,130,0.92);
  transition:opacity 0.3s ease,color 0.3s ease;
}
#enter.out{opacity:0!important;pointer-events:none;transition:opacity 0.7s ease!important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="glow"></div>

<div id="emblem-wrap">
  <img id="emblem-img" src="lunara_emblem_v2_768.png" alt="Lunara Society">
</div>

<div id="welcome">Welcome to Lunara Society</div>
<div id="enter">Enter</div>

<script>
(function(){

const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const embImg  = document.getElementById('emblem-img');
const glowEl  = document.getElementById('glow');
const embWrap = document.getElementById('emblem-wrap');
const welEl   = document.getElementById('welcome');
const entEl   = document.getElementById('enter');

let W, H, cx, cy, dpr;
let dissolveParticles = [];
let dissolving = false;
let dissolveStart = 0;
let phase = 'black'; // black → reveal → living → dissolve
let phaseStart = 0;
let animT = 0, lastT = 0;

// ── Size helpers ─────────────────────────────
function emblemPx(){
  return Math.min(W, H) * 0.52;   // emblem covers ~52% of shortest viewport dimension
}

function setLayout(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr, dpr);
  cx = W/2; cy = H/2;

  const ep = emblemPx();
  embImg.style.width  = ep + 'px';
  embImg.style.height = ep + 'px';
  glowEl.style.width  = (ep * 1.15) + 'px';
  glowEl.style.height = (ep * 1.15) + 'px';

  // Text positioning below emblem
  const textTop = cy + ep/2 + 30;
  welEl.style.top  = textTop + 'px';
  entEl.style.top  = (textTop + 34) + 'px';
}

// ── Dissolve particle system ──────────────────
// Only runs on Enter click. Samples emblem pixels, explodes outward.
function buildDissolveParticles(callback){
  const offC = document.createElement('canvas');
  const offCtx = offC.getContext('2d');
  const ep = emblemPx();
  const SZ = 192; // internal sample resolution
  offC.width = SZ; offC.height = SZ;
  offCtx.drawImage(embImg, 0, 0, SZ, SZ);
  const dat = offCtx.getImageData(0,0,SZ,SZ).data;

  const scale = ep / SZ;
  const ox = cx - ep/2;
  const oy = cy - ep/2;
  const pts = [];
  const step = 2;

  for(let y=0;y<SZ;y+=step){
    for(let x=0;x<SZ;x+=step){
      const i=(y*SZ+x)*4;
      const r=dat[i],g=dat[i+1],b=dat[i+2];
      if((r+g+b)/3 < 20) continue;

      const px = ox + x*scale + (Math.random()-0.5)*2;
      const py = oy + y*scale + (Math.random()-0.5)*2;
      const ang = Math.atan2(py-cy, px-cx);
      const spread = (Math.random()-0.5)*0.5;
      const speed = 1.2 + Math.random()*3.2;

      pts.push({
        x: px, y: py,
        vx: Math.cos(ang+spread)*speed,
        vy: Math.sin(ang+spread)*speed,
        r: r, g: g, b: b,
        sz: 0.6 + Math.random()*0.8,
        life: 0.8 + Math.random()*0.2
      });
    }
  }

  dissolveParticles = pts;
  callback();
}

// ── Main loop ─────────────────────────────────
function loop(now){
  const dt = Math.min((now - lastT)/1000, 0.05);
  lastT = now; animT += dt;

  ctx.clearRect(0, 0, W, H);

  const el = now - phaseStart;

  if(phase === 'black'){
    if(el > 900){ phase='reveal'; phaseStart=now; }
  }
  else if(phase === 'reveal'){
    // CSS handles the image fade-in
    if(el === 0 || el < 50){
      embImg.classList.add('visible');
      glowEl.classList.add('visible');
    }
    if(el > 3400){
      phase='living'; phaseStart=now;
      embImg.classList.add('breathe');
      glowEl.classList.add('breathe');
    }
  }
  else if(phase === 'living'){
    // Show text
    if(el > 400  && !welEl.classList.contains('show')) welEl.classList.add('show');
    if(el > 2000 && !entEl.classList.contains('show')) entEl.classList.add('show');
    // nothing to draw on canvas — CSS handles emblem life
  }
  else if(phase === 'dissolve'){
    const elapsed = now - dissolveStart;
    // Draw dissolving particles
    dissolveParticles.forEach(p=>{
      if(p.life <= 0) return;
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.983; p.vy *= 0.983;
      p.life -= 0.007;
      ctx.fillStyle='rgba('+p.r+','+p.g+','+p.b+','+(p.life*0.78)+')';
      ctx.fillRect(p.x, p.y, p.sz, p.sz);
    });
    if(elapsed > 2800) { window.location.href='home.html'; return; }
  }

  requestAnimationFrame(loop);
}

// ── Enter interaction ─────────────────────────
function activate(){
  if(dissolving) return;
  dissolving = true;

  // Hide CSS elements
  embImg.classList.add('dissolving');
  glowEl.classList.add('dissolving');
  welEl.classList.add('out');
  entEl.classList.add('out');

  // Build particles from current emblem then start dissolve
  buildDissolveParticles(function(){
    phase = 'dissolve';
    dissolveStart = performance.now();
  });
}

entEl.addEventListener('click', activate);
entEl.addEventListener('touchstart', function(e){ e.preventDefault(); activate(); }, {passive:false});

// Hover: emblem brightens via CSS :hover on wrap
// Also boost glow on enter hover
entEl.addEventListener('mouseenter', function(){
  glowEl.style.boxShadow='0 0 90px 30px rgba(220,170,55,0.32),0 0 160px 60px rgba(210,150,30,0.15)';
});
entEl.addEventListener('mouseleave', function(){
  glowEl.style.boxShadow='';
});

window.addEventListener('resize', function(){
  setLayout();
});

// ── Init ─────────────────────────────────────
setLayout();
phaseStart = performance.now();
lastT = phaseStart;
requestAnimationFrame(loop);

// Prefetch main site
const pre = document.createElement('link');
pre.rel='prefetch'; pre.href='home.html';
document.head.appendChild(pre);

})();
</script>
</body>
</html>
