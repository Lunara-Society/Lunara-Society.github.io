<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="description" content="Lunara Society — Constitutional governance authority for the autonomous economy.">
<title>Lunara Society</title>
<link rel="icon" type="image/png" href="lunara_logo_512.png">
<link rel="apple-touch-icon" href="lunara_logo_512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{cursor:default}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
#welcome{
  position:fixed;left:50%;transform:translateX(-50%);
  white-space:nowrap;opacity:0;
  font-family:'Cormorant Garamond',serif;
  font-size:13px;font-weight:300;
  letter-spacing:0.5em;color:rgba(210,185,140,0.88);
  text-transform:uppercase;text-align:center;
  transition:opacity 2.8s ease;
  z-index:20;pointer-events:none;
}
#enter{
  position:fixed;left:50%;transform:translateX(-50%);
  white-space:nowrap;opacity:0;
  font-family:'Inter',sans-serif;
  font-size:11px;font-weight:200;
  letter-spacing:0.5em;color:rgba(196,164,107,0.55);
  text-transform:uppercase;text-align:center;
  transition:opacity 2.2s ease;
  z-index:20;cursor:pointer;
  padding:12px 30px;
}
#enter.show{opacity:0.55}
#enter:hover{opacity:1;color:rgba(220,195,145,0.95);transition:opacity 0.35s ease,color 0.35s ease}
#welcome.show{opacity:0.9}
body.out #welcome,body.out #enter{opacity:0!important;transition:opacity 0.9s ease!important;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="welcome">Welcome to Lunara Society</div>
<div id="enter">Enter</div>

<script>
(function(){
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const welcomeEl = document.getElementById('welcome');
const enterEl = document.getElementById('enter');

let W,H,cx,cy,dpr;
let particles=[];
let phase='black';
let phaseT=0;
let hover=0,hoverTarget=0;
let dissolving=false,dissolveT=0;
let t=0,lastT=0;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  cx=W/2; cy=H/2;
  // Position text
  const emblemR = Math.min(W,H)*0.21;
  welcomeEl.style.top = (cy + emblemR + 38) + 'px';
  enterEl.style.top   = (cy + emblemR + 70) + 'px';
}

// ── Particle ──────────────────────────────────
class P {
  constructor(hx,hy,gold){
    this.hx=hx; this.hy=hy;
    this.gold=gold; // 0..1 how gold the source pixel is
    // start scattered
    const ang=Math.random()*Math.PI*2;
    const rad=Math.min(W,H)*(0.6+Math.random()*0.4);
    this.x=cx+Math.cos(ang)*rad;
    this.y=cy+Math.sin(ang)*rad;
    this.vx=0; this.vy=0;
    this.sz=0.55+Math.random()*0.8;
    this.ph=Math.random()*Math.PI*2;
    this.freq=0.18+Math.random()*0.28;
    this.amp=0.2+Math.random()*0.55;
    this.bright=0.4+Math.random()*0.6;
    this.colorV=Math.random();
    this.life=0;
    this.dvx=0; this.dvy=0;
  }

  update(time,h){
    if(dissolving){
      this.x+=this.dvx; this.y+=this.dvy;
      this.dvx*=0.984; this.dvy*=0.984;
      this.life-=0.006;
      return;
    }
    // breathing oscillation — more alive near hover
    const factor=1+h*2.8;
    const ox=Math.sin(time*this.freq+this.ph)*this.amp*factor;
    const oy=Math.cos(time*this.freq*0.73+this.ph)*this.amp*factor;
    const tx=this.hx+ox, ty=this.hy+oy;
    this.vx+=(tx-this.x)*0.038;
    this.vy+=(ty-this.y)*0.038;
    this.vx*=0.83; this.vy*=0.83;
    this.x+=this.vx; this.y+=this.vy;
  }

  draw(ctx){
    if(this.life<=0) return;
    const a=this.bright*this.life;
    // gold gradient: brighter gold for high-gold pixels
    let r,g,b;
    const g0=this.gold;
    if(g0>0.75){
      // brightest — warm white-gold
      r=235+Math.random()*15|0;
      g=195+Math.random()*20|0;
      b=110+Math.random()*30|0;
    } else if(g0>0.45){
      r=200; g=162; b=90;
    } else {
      r=165; g=128; b=72;
    }
    ctx.fillStyle='rgba('+r+','+g+','+b+','+(a*0.82)+')';
    ctx.fillRect(this.x,this.y,this.sz,this.sz);
  }
}

// ── Build particles from emblem image ──────────
function build(cb){
  const img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){
    const off=document.createElement('canvas');
    const SZ=img.width;
    off.width=SZ; off.height=SZ;
    const oc=off.getContext('2d');
    oc.drawImage(img,0,0);
    const dat=oc.getImageData(0,0,SZ,SZ).data;

    // emblem radius on screen
    const R=Math.min(W,H)*0.21;
    const scale=(R*2)/SZ;
    const ox=cx-R, oy=cy-R;

    const pts=[];
    const step=2; // denser sampling for this richer image
    for(let y=0;y<SZ;y+=step){
      for(let x=0;x<SZ;x+=step){
        const i=(y*SZ+x)*4;
        const r=dat[i],g=dat[i+1],b=dat[i+2];
        const br=(r+g+b)/3;
        if(br<22) continue; // skip pure black bg
        // goldness: r high, g medium, b low
        const goldness=Math.min(1,(r/255)*((r-b)/255+0.3));
        pts.push({
          x:ox+x*scale+(Math.random()-0.5)*1.2,
          y:oy+y*scale+(Math.random()-0.5)*1.2,
          gold:goldness
        });
      }
    }

    // cap at 4000 particles, weighted toward bright pixels
    pts.sort((a,b_)=>b_.gold-a.gold);
    const MAX=4000;
    const use=pts.length>MAX ? pts.slice(0,Math.floor(MAX*0.7)).concat(
      pts.slice(Math.floor(MAX*0.7)).sort(()=>Math.random()-0.5).slice(0,Math.floor(MAX*0.3))
    ) : pts;

    use.forEach(p=>particles.push(new P(p.x,p.y,p.gold)));
    cb();
  };
  img.src='lunara_emblem_activation.png';
}

// ── Glow ─────────────────────────────────────
function glow(h){
  if(dissolving) return;
  const R=Math.min(W,H)*0.26;
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  const a=0.011+h*0.009;
  gr.addColorStop(0,'rgba(210,160,70,'+a+')');
  gr.addColorStop(0.4,'rgba(196,140,50,'+(a*0.35)+')');
  gr.addColorStop(1,'rgba(196,140,50,0)');
  ctx.fillStyle=gr;
  ctx.fillRect(cx-R,cy-R,R*2,R*2);
}

// ── Loop ─────────────────────────────────────
function loop(now){
  const dt=Math.min((now-lastT)/1000,0.05);
  lastT=now; t+=dt;
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  const el=now-phaseT;

  if(phase==='black'){
    if(el>900){phase='materialize';phaseT=now;}
  }
  else if(phase==='materialize'){
    const prog=Math.min(el/3200,1);
    const ease=1-Math.pow(1-prog,3);
    glow(0);
    particles.forEach(p=>{
      p.update(t,0);
      p.life=ease*p.bright;
      p.draw(ctx);
    });
    if(prog>=1){
      phase='living'; phaseT=now;
      particles.forEach(p=>p.life=p.bright);
    }
  }
  else if(phase==='living'){
    hover+=(hoverTarget-hover)*0.045;
    glow(hover*0.5);
    particles.forEach(p=>{p.update(t,hover);p.draw(ctx);});
    if(el>1400 && !welcomeEl.classList.contains('show')) welcomeEl.classList.add('show');
    if(el>3000 && !enterEl.classList.contains('show'))   enterEl.classList.add('show');
  }
  else if(phase==='dissolve'){
    particles.forEach(p=>{p.update(t,0);p.draw(ctx);});
    if(now-dissolveT>2600) { window.location.href='home.html'; return; }
  }

  requestAnimationFrame(loop);
}

// ── Events ───────────────────────────────────
function doEnter(){
  if(dissolving) return;
  dissolving=true;
  phase='dissolve'; dissolveT=performance.now();
  document.body.classList.add('out');
  particles.forEach(p=>{
    const dx=p.x-cx, dy=p.y-cy;
    const ang=Math.atan2(dy,dx);
    const sp=1.0+Math.random()*2.8;
    const spread=(Math.random()-0.5)*0.5;
    p.dvx=Math.cos(ang+spread)*sp;
    p.dvy=Math.sin(ang+spread)*sp;
    p.life=1.0;
  });
}

enterEl.addEventListener('click',doEnter);
enterEl.addEventListener('touchstart',function(e){e.preventDefault();doEnter();},{passive:false});

enterEl.addEventListener('mouseenter',function(){if(!dissolving)hoverTarget=1.6;});
enterEl.addEventListener('mouseleave',function(){if(!dissolving)hoverTarget=0;});

document.addEventListener('mousemove',function(e){
  if(dissolving||enterEl.matches(':hover')) return;
  const dx=e.clientX-cx, dy=e.clientY-cy;
  const R=Math.min(W,H)*0.24;
  const dist=Math.sqrt(dx*dx+dy*dy);
  hoverTarget = dist<R ? (1-(dist/R))*0.65 : 0;
});

window.addEventListener('resize',function(){resize();});

// ── Init ─────────────────────────────────────
resize();
phaseT=performance.now();
lastT=phaseT;
build(function(){requestAnimationFrame(loop);});

// prefetch main site
const pre=document.createElement('link');
pre.rel='prefetch'; pre.href='home.html';
document.head.appendChild(pre);
})();
</script>
</body>
</html>
